<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Proxy Generator Pro</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .panel { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 350px; text-align: center; }
        .data-box { background: #0f172a; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #334155; }
        .ip-text { color: #38bdf8; font-size: 1.5rem; font-weight: bold; font-family: monospace; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Proxy Generator</h2>
    <div class="data-box">
        <div>IP Address:</div>
        <div id="ip" class="ip-text">---</div>
        <div style="margin-top:10px">Port: <span id="port" style="color:#fbbf24">---</span></div>
    </div>
    <button onclick="generateProxy()">Tạo Proxy Mới</button>
</div>

<script>
    function generateProxy() {
        // Tạo IP ngẫu nhiên
        const octet = () => Math.floor(Math.random() * 256);
        const ip = `${octet()}.${octet()}.${octet()}.${octet()}`;
        
        // Tạo Port ngẫu nhiên từ 1024 đến 65535
        const port = Math.floor(Math.random() * (65535 - 1024 + 1)) + 1024;
        
        document.getElementById('ip').innerText = ip;
        document.getElementById('port').innerText = port;
    }
    // Chạy lần đầu
    generateProxy();
</script>

</body>
</html>
