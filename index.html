<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Control</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00d4ff; margin-bottom: 1.5rem; }
        .proxy-item { background: #2c2c2c; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-copy { background: #00d4ff; border: none; padding: 8px 12px; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Danh sách Proxy</h2>
    
    <div class="proxy-item">
        <span>IP: 1.2.3.4 | Port: 8080</span>
        <button class="btn-copy" onclick="alert('Đã copy 1.2.3.4')">Copy</button>
    </div>
    
    <div class="proxy-item">
        <span>IP: 5.6.7.8 | Port: 8080</span>
        <button class="btn-copy" onclick="alert('Đã copy 5.6.7.8')">Copy</button>
    </div>

    <p style="font-size: 0.8rem; color: #888; text-align: center; margin-top: 20px;">
        Hệ thống cấu hình Proxy thủ công
    </p>
</div>

</body>
</html>
